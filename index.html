<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Ragdoll Rumble</title>
	<meta name="application-name" content="Ragdoll Rumble">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<style>
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #231F20; }
		#game-container { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
		#game-container canvas { width: 100%; height: 100%; display: block; }
		#loader {
			position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
			background: #231F20; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 15px;
			user-select: none;
		}
	</style>
	<script src="game-driver.js"></script>
</head>
<body>
	<div id="game-container">
		<canvas id="game" width="960" height="600"></canvas>
	</div>
	<div id="loader">Loading…</div>
	<script src="Build/7a2dbded24d57e056180125b1583e7c4.loader.js"></script>
	<script>
		(function () {
			var container = document.getElementById('game-container');
			function fit() {
				var maxRatio = 24 / 9, minRatio = 9 / 24;
				var w = window.innerWidth, h = window.innerHeight, r = w / h;
				var cw = w, ch = h;
				if (r > maxRatio) cw = h * maxRatio; else if (r < minRatio) ch = w / minRatio;
				container.style.width = cw + 'px';
				container.style.height = ch + 'px';
			}
			window.addEventListener('resize', fit);
			window.addEventListener('focus', fit);
			fit();

			var canvas = document.getElementById('game');
			createUnityInstance(canvas, {
				dataUrl: 'Build/8713f803a543bc5baa75866985a3aa56.data',
				frameworkUrl: 'Build/c505c9b51b0c0d9516dcfbf47c40306e.framework.js',
				codeUrl: 'Build/9cb8446aad06576e9771d7dc0f11afb3.wasm',
				webglContextAttributes: { preserveDrawingBuffer: true },
				streamingAssetsUrl: 'StreamingAssets',
				companyName: 'Standalone Game',
				productName: 'Ragdoll Rumble',
				productVersion: '1.0',
				showBanner: function () {}
			}).then(function (instance) {
				window.unityGame = instance;
				var loader = document.getElementById('loader');
				if (loader) loader.style.display = 'none';
			}).catch(function (err) {
				console.error(err);
			});
		})();
	</script>
</body>
</html>
